# backend/alembic.ini
# Configuracion de Alembic - migrations de la DB tienda_ropa.
# La URL de conexion NO se define aqui (sin credenciales hardcodeadas):
# se resuelve en alembic/env.py con la misma cadena que app/core/database.py:
#   1. os.environ["DATABASE_URL"]  2. Settings (linea DATABASE_URL del .env,
#   o partes DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME)  3. fallbacks locales.
# NOTA: este archivo se lee con el encoding locale del SO (cp1252 en Windows),
# por eso los comentarios son ASCII puro.
[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

# timezone: OPCION OMITIDA A PROPOSITO. El venv de este proyecto (Windows,
# Python 3.14) no tiene el paquete tzdata, y alembic 1.19.1 llama a
# ZoneInfo(<timezone>) cuando la opcion existe (aunque este vacia o sea UTC),
# lo que revienta en Windows sin tzdata. Sin la opcion, usa datetime.now().
# (La fecha del archivo igual lleva year/month/day/hour/minute del template.)

# placeholder - reemplazado en runtime por env.py (ver cabecera de este archivo)
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
